<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Armado en México — Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #0d0f0c;
    color: #e8e6e0;
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(201,162,39,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,162,39,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none; z-index: 0;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  }
  #app-root { position: relative; z-index: 1; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #07080a; }
  ::-webkit-scrollbar-thumb { background: #2a2f24; }
  ::-webkit-scrollbar-thumb:hover { background: #c9a227; }
  ::selection { background: rgba(201,162,39,0.4); color: #fff; }

  input::placeholder, textarea::placeholder { color: #6a685e; }
  input:focus, textarea:focus, select:focus { border-color: #c9a227 !important; }
  button:focus-visible { outline: 1px solid #c9a227; outline-offset: 1px; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  code { font-family: 'JetBrains Mono', monospace; }

  /* range slider */
  input[type=range] { accent-color: #c9a227; }
</style>
</head>
<body>

<div id="app-root"></div>

<!-- React + Babel pinned -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js?v=20260824"></script>
<script src="data-precios.js?v=20260824"></script>
<script src="store.js"></script>
<!-- ui.jsx aporta AvailBadge para los badges en la tabla -->
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="admin.jsx"></script>

<script type="text/babel">
const root = ReactDOM.createRoot(document.getElementById('app-root'));
root.render(<window.AdminApp />);
</script>


<!-- DEV: alternador de viewport escritorio/móvil (compartido por las 3 ramas) -->
<script src="dev-viewport.js"></script>
</body>
</html>

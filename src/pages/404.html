<html lang="es">
<head>
<meta charset="utf-8">
<title>Armado en México</title>
<!-- Esta página solo redirige, pero el navegador pinta su lienzo antes de
     seguir. Con `color-scheme` el lienzo por defecto ya sale oscuro en un
     equipo en modo oscuro y no hay fogonazo blanco camino del index. No lee
     la preferencia guardada a propósito: no compensa un script para una
     página que vive milisegundos. -->
<style>:root { color-scheme: light dark; }</style>
<script>
  /* GitHub Pages SPA fallback. Cualquier dirección profunda (ej. /calibres,
     /pistolas/glock-19) que el servidor no encuentra como archivo cae aquí; reescribimos
     la ruta a /?/<ruta> y redirigimos al index, que la restaura con History API.
     pathSegmentsToKeep = 0  →  app servida en la raíz del dominio (armado.mx). */
  (function () {
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  })();
</script>
</head>
<body></body>
</html>

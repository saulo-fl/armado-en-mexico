<!DOCTYPE html>
<!-- data-tema fijo: el panel de admin SIEMPRE va en oscuro. Su chasis
     (#0d0f0c, más abajo) siempre lo fue, y desde que `PALETTE` guarda tokens en
     vez de hex —admin.jsx la reusa vía `ADMIN_PALETTE = window.PALETTE`— hay
     que decirle a qué tema pertenece o pintaría la paleta clara sobre el
     chasis oscuro. Aquí no hay conmutador: no es la app pública. -->
<html lang="es" data-tema="oscuro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Armado en México — Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- estilo.css se carga por los TOKENS: sin él, `var(--acento)` y compañía no
     resuelven y el panel sale sin color. El ?v= es obligatorio (guardia 7b de
     build-prerender.mjs). -->
<link rel="stylesheet" href="estilo.css?v=20260916a">

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #0d0f0c;
    color: #e8e6e0;
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(201,162,39,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,162,39,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none; z-index: 0;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  }
  #app-root { position: relative; z-index: 1; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #07080a; }
  ::-webkit-scrollbar-thumb { background: #2a2f24; }
  ::-webkit-scrollbar-thumb:hover { background: #c9a227; }
  ::selection { background: rgba(201,162,39,0.4); color: #fff; }

  input::placeholder, textarea::placeholder { color: #6a685e; }
  input:focus, textarea:focus, select:focus { border-color: #c9a227 !important; }
  button:focus-visible { outline: 1px solid #c9a227; outline-offset: 1px; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  code { font-family: 'JetBrains Mono', monospace; }

  /* range slider */
  input[type=range] { accent-color: #c9a227; }
</style>
</head>
<body>

<div id="app-root"></div>

<!-- React pinned (los .jsx se precompilan a .js en el build — ver package.json) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>

<script src="data.js?v=20260916a"></script>
<script src="data-precios.js?v=20260914k"></script>
<script src="store.js?v=20260914j"></script>
<!-- ui.jsx aporta AvailBadge para los badges en la tabla -->
<script src="ui.js?v=20260916a"></script>
<script src="admin.js?v=20260914j"></script>

<script>
const root = ReactDOM.createRoot(document.getElementById('app-root'));
root.render(React.createElement(window.AdminApp));
</script>


<!-- DEV: alternador de viewport escritorio/móvil (compartido por las 3 ramas) -->
<script src="dev-viewport.js?v=20260908"></script>
</body>
</html>

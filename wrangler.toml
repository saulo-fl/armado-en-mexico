# Armado en México — configuración de Cloudflare Pages + Functions + D1
# =============================================================================
# La app es estática. La fuente vive en  src/  y  public/ ; el build la deja en
#  out/ , que es lo que Pages publica. Las Functions viven en  functions/  (en la
# RAÍZ del repo, fuera de out/ — Pages las descubre ahí) y
# Cloudflare Pages las despliega automáticamente. La base D1 se expone a las
# Functions como  env.DB .
#
# ALTA YA REALIZADA (25-ago-2026) — ver docs/BACKEND.md. Queda documentado por si hay
# que rehacerla en otra cuenta:
#   1. wrangler d1 create armado-en-mexico   → de ahí sale el database_id.
#   2. wrangler d1 execute armado-en-mexico --remote --file=./scripts/sql/schema.sql
#   3. Variables de Access: en [vars] de abajo (no son secretas).
#   4. Política de Cloudflare Access sobre  /admin*  y (opcional) /api/admin/*
#      — es lo que realmente protege la escritura del admin.
# =============================================================================

name = "armado-en-mexico"
compatibility_date = "2024-09-01"
pages_build_output_dir = "out"

# ── D1 ACTIVO ────────────────────────────────────────────────────────────────
# OJO: el binding debe llamarse DB (es lo que leen las Functions como env.DB).
# `wrangler d1 create` sugiere en su salida `binding = "armado_en_mexico"`: NO
# uses ese nombre o las Functions no encontrarán la base y caerán a fallback.
# Si el database_id no es válido, el deploy FALLA entero ("Error 8000022") y no
# publica nada — el sitio anterior sigue vivo, pero no sale nada nuevo.
[[d1_databases]]
binding = "DB"
database_name = "armado-en-mexico"
database_id = "0b044863-4127-44c5-a6b9-0f72607a0c08"

# Variables públicas (NO son secretas: el AUD tag y el team domain viajan a la
# vista en la propia URL de login de Access). La seguridad no viene de que estén
# ocultas, sino de la verificación de la firma del JWT contra el JWKS de Access.
[vars]
CF_ACCESS_TEAM_DOMAIN = "armado-en-mexico.cloudflareaccess.com"
CF_ACCESS_AUD = "6ce9ebe0f386d068bc8abf8f047319beaa6878443d7d35622012f4528e26fb7a"

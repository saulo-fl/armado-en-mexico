name: Reportar un fallo del sitio
description: Algo no carga, se ve mal o no hace lo que debería.
title: "[Fallo]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Este issue será público. No incluyas datos personales. Para denunciar una reseña usa https://armado.mx/soporte y, si el problema es un dato incorrecto, el formulario «Corregir información de la enciclopedia».
  - type: input
    id: pagina
    attributes:
      label: Página donde ocurre
      description: URL o ruta donde viste el fallo.
      placeholder: https://armado.mx/pistolas/ejemplo
    validations:
      required: true
  - type: textarea
    id: que_paso
    attributes:
      label: ¿Qué pasó?
      description: Describe lo que viste, con el texto exacto de cualquier mensaje de error.
    validations:
      required: true
  - type: textarea
    id: que_esperabas
    attributes:
      label: ¿Qué esperabas que pasara?
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Lo que hiciste, en orden, hasta que apareció el fallo.
      placeholder: |
        1. Entré a…
        2. Toqué…
        3. Apareció…
    validations:
      required: true
  - type: dropdown
    id: frecuencia
    attributes:
      label: ¿Con qué frecuencia ocurre?
      options:
        - Siempre
        - A veces
        - Solo una vez
    validations:
      required: true
  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo y navegador
      description: Opcional. Desde armado.mx puedes adjuntarlo automáticamente con la casilla de datos del dispositivo.
      placeholder: iPhone 13 · Safari
    validations:
      required: false
  - type: input
    id: captura
    attributes:
      label: Captura o video
      description: Opcional. Enlace a una imagen o video donde se vea el fallo.
      placeholder: https://…
    validations:
      required: false
  - type: checkboxes
    id: privacidad
    attributes:
      label: Privacidad
      options:
        - label: Confirmo que el reporte no incluye datos personales, míos ni de terceros.
          required: true
